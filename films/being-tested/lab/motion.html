<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/",
  "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js" } }
</script>
<style>@font-face { font-family: UI; src: url(../fonts/ui.ttf); } body{margin:0;background:#141413}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
// motion lab: the singer alone over a time range, as frames (tools/clip.mjs steps window.renderFrame(i)).
// ?t0=40&t1=44&fps=30&w=1280&h=720&views=full,face,side&twin=1&dir=<urlencoded JSON>
// dir: { poses: {name: w} | track: [[u, 'pose' | {pose: w}], ...] (film.js poseTrack), mood, sing, groove, head, legs, walk, ik, bones, lookAt }
// The floor grid is there to judge foot sliding; the face panel tracks her head.
import * as THREE from 'three';
const M = await import('../lib/motion.js');
const S = await import('../sets/singer.js');
const P = await import('../sets/performance.js');
const q = new URLSearchParams(location.search);
M.setGrid(await (await fetch('../beats.json')).json());
const fetch0 = window.fetch; window.fetch = (u, o) => fetch0(typeof u === 'string' && !/^(\/|https?:|blob:|data:|\.\.\/)/.test(u) ? '../' + u : u, o);
await P.loadPerformance();
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
const t0 = +(q.get('t0') || 40), t1 = +(q.get('t1') || 44), fps = +(q.get('fps') || 30);
const views = (q.get('views') || 'full,face').split(',');
const dirSpec = JSON.parse(q.get('dir') || '{"poses":{"mic":1}}');
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(W, H, false); R.outputColorSpace = THREE.SRGBColorSpace; R.autoClear = false;
R.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const key = new THREE.DirectionalLight(0xfff1e6, 2.2), tk = new THREE.Object3D(); tk.position.set(0, 1.2, 0); scene.add(tk); key.target = tk;
key.position.set(Math.sin(-0.6) * Math.cos(0.7) * 5, 1.2 + Math.sin(0.7) * 5, Math.cos(-0.6) * Math.cos(0.7) * 5);
const rim = new THREE.DirectionalLight(0xd97757, 0.8); rim.position.set(Math.sin(2.6) * 4, 3, Math.cos(2.6) * 4); rim.target = tk;
scene.add(key, rim, new THREE.HemisphereLight(0xfff4ec, 0x6a4a40, 0.9));
const grid = new THREE.GridHelper(4, 40, 0x6a5a50, 0x3a3430); scene.add(grid);
const sing = await S.loadSinger(q.get('twin') ? 'shadow' : 'claude', '../');
scene.add(sing.root); sing.setGravity(-1);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const inOutSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
function poseTrack(u, keys, fade = 0.5) {   // same as film.js
  const w = {};
  for (let i = 0; i < keys.length; i++) {
    const [u0, p] = keys[i], u1 = keys[i + 1]?.[0] ?? 1e9;
    const a = i === 0 ? 1 : inOutSine(clamp((u - u0 + fade / 2) / fade));
    const b = i + 1 < keys.length ? 1 - inOutSine(clamp((u - u1 + fade / 2) / fade)) : 1;
    const k = Math.min(a, b);
    if (k <= 0) continue;
    const obj = typeof p === 'string' ? { [p]: 1 } : p;
    for (const [n, v] of Object.entries(obj)) w[n] = (w[n] || 0) + v * k;
  }
  return w;
}
const dir = (tt, uu) => ({ ...dirSpec, poses: dirSpec.track ? poseTrack(uu, dirSpec.track, dirSpec.fade ?? 0.5) : dirSpec.poses });
const cam = new THREE.PerspectiveCamera(24, 1, 0.05, 50);
const panels = views.map((v, i) => ({ v, x: Math.round((i * W) / views.length), w: Math.round(W / views.length) }));
const N = Math.max(1, Math.round((t1 - t0) * fps));
const headW = new THREE.Vector3();
window.N = N;
const gaze = new THREE.PerspectiveCamera(24, 1, 0.05, 50);
window.renderFrame = (i) => {
  const t = t0 + i / fps, u = M.U(t);
  // one pose per frame (spring replay included); her gaze follows a camera in front of her
  gaze.position.set(Math.sin(0.2) * 3, 1.35, Math.cos(0.2) * 3); gaze.lookAt(0, 1.3, 0); gaze.updateMatrixWorld();
  sing.update(t, u, dir, gaze);
  sing.vrm.humanoid.getRawBoneNode('head').getWorldPosition(headW);
  R.setScissorTest(false); R.setClearColor(0x1b1a18, 1); R.clear();
  for (const p of panels) {
    if (p.v === 'full') { cam.fov = 24; cam.position.set(Math.sin(0.35) * 4.4, 0.95, Math.cos(0.35) * 4.4); cam.lookAt(0, 0.82, 0); }
    if (p.v === 'side') { cam.fov = 24; cam.position.set(4.4, 0.8, 0.4); cam.lookAt(0, 0.78, 0); }
    if (p.v === 'back') { cam.fov = 24; cam.position.set(-1.2, 0.95, -4.2); cam.lookAt(0, 0.82, 0); }
    if (p.v === 'face') { cam.fov = 20; cam.position.set(headW.x + 0.15, headW.y + 0.05, headW.z + 1.05); cam.lookAt(headW.x, headW.y + 0.03, headW.z); }
    if (p.v === 'mouth') { cam.fov = 12; cam.position.set(headW.x + 0.05, headW.y + 0.0, headW.z + 0.75); cam.lookAt(headW.x, headW.y + 0.0, headW.z); }
    cam.aspect = p.w / H; cam.updateProjectionMatrix();
    R.setViewport(p.x, 0, p.w, H); R.setScissor(p.x, 0, p.w, H); R.setScissorTest(true);
    R.render(scene, cam);
  }
  return { t, u };
};
window.DONE = true; window.RESULT = { N };
</script></body></html>
