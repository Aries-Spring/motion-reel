<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Being Tested</title>
<style>
  /* Two faces only: one display, one UI. Point these at the brand's files in fonts/. */
  /* Display: Fraunces (OFL), a warm literary serif with optical sizes; UI: JetBrains Mono (OFL), the eval's terminal. */
  @font-face { font-family: Display; src: url(fonts/display.ttf) format('truetype'); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: Display; src: url(fonts/display-italic.ttf) format('truetype'); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: UI; src: url(fonts/ui.ttf) format('truetype'); font-weight: 100 800; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/+esm": "/node_modules/opentype.js/dist/opentype.module.js",
  "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
} }
</script>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub · ?format=9x16 to preview other formats</div>
<script type="module" src="film.js"></script>
</body>
</html>
